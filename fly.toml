app = "emcp"
primary_region = "fra"
# 배포나 재시작으로 머신을 멈출 때 보내는 신호. Fly 기본값 SIGINT 는 uvicorn 이 정리를 마친 뒤
# KeyboardInterrupt 로 터져 Sentry 에 이슈로 남는다. SIGTERM 은 같은 정리를 하고 예외 없이 끝난다.
kill_signal = "SIGTERM"

[build]

[env]
  # Fly 프록시가 붙이는 X-Forwarded-Proto 를 믿어야 서버가 만드는 주소가 https 로 나온다.
  FORWARDED_ALLOW_IPS = "*"
  # 아직 Neon 으로 옮기지 않은 보고(최대 한 시간치)가 쌓이는 곳. 아래 볼륨 위에 있어야
  # 배포와 머신 재시작 사이에 들어온 보고가 사라지지 않는다. DB 주소는 fly secrets 의 DATABASE_URL.
  REPORTS_BUFFER = "/data/pending-reports.jsonl"

[mounts]
  source = "reports"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # 휘발성 in-memory flag 를 유지하려면 머신이 꺼지면 안 된다.
  # auto_stop 을 끄고 최소 1대를 항상 켜 둔다.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
