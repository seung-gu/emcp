<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 688" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="board-registration-title board-registration-desc" id="board-registration-root">
        <title id="board-registration-title">보드 등록 흐름</title>
        <desc id="board-registration-desc">사용자가 보드에 Wi-Fi 정보를 넣으면 보드가 토큰과 등록 코드를 만들어 서버에 한 번 물어본 뒤 QR과 코드를 띄우고, 사용자가 로그인해 그 코드를 넣으면 서버가 보드를 계정에 연결하며, RESET을 누른 보드가 다시 물어볼 때 registered 답을 받는 순서를 보여 줍니다.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #board-registration-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #board-registration-root { font-family: var(--font-sans); color: var(--color-ink); }
      #board-registration-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#board-registration-root .diagram-container { overflow-x: visible; }
}</style>
        <marker id="board-registration-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="board-registration-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        <marker id="board-registration-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <!-- Lifelines: phone 160, server 480, board 800 -->
        <line x1="160" y1="96" x2="160" y2="600" stroke="#2d3142" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.20"/>
        <line x1="480" y1="96" x2="480" y2="600" stroke="#2d3142" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.20"/>
        <line x1="800" y1="96" x2="800" y2="600" stroke="#2d3142" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.20"/>
        <!-- Activation bars -->
        <rect x="796" y="144" width="8" height="224" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.06"/>
        <rect x="476" y="232" width="8" height="72" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.06"/>
        <rect x="476" y="424" width="8" height="48" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.06"/>
        <rect x="476" y="528" width="8" height="48" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.06"/>
        <rect x="796" y="528" width="8" height="56" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.06"/>
        <!-- Messages (time flows down) -->
        <line x1="160" y1="144" x2="796" y2="144" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#board-registration-arrow)"/>
        <path d="M 804,168 H 828 Q 836,168 836,176 V 184 Q 836,192 828,192 H 806" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#board-registration-arrow)"/>
        <line x1="796" y1="232" x2="484" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#board-registration-arrow)"/>
        <path d="M 484,248 H 508 Q 516,248 516,256 V 264 Q 516,272 508,272 H 486" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#board-registration-arrow)"/>
        <line x1="484" y1="304" x2="796" y2="304" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#board-registration-arrow)"/>
        <line x1="796" y1="360" x2="160" y2="360" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#board-registration-arrow-open)"/>
        <line x1="160" y1="424" x2="476" y2="424" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#board-registration-arrow)"/>
        <path d="M 484,440 H 508 Q 516,440 516,448 V 456 Q 516,464 508,464 H 486" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#board-registration-arrow)"/>
        <line x1="796" y1="528" x2="484" y2="528" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#board-registration-arrow)"/>
        <line x1="484" y1="576" x2="796" y2="576" stroke="#bf4520" stroke-width="1.4" marker-end="url(#board-registration-arrow-accent)"/>
        <!-- Message labels, each on a paper mask -->
        <rect x="268" y="120" width="104" height="16" rx="2" fill="#f5f5f5"/>
        <text x="320" y="132" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">1. Wi-Fi 정보</text>
        <rect x="844" y="172" width="96" height="16" rx="2" fill="#f5f5f5"/>
        <text x="892" y="184" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">토큰·코드 생성</text>
        <rect x="588" y="208" width="104" height="16" rx="2" fill="#f5f5f5"/>
        <text x="640" y="220" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">2. 토큰 + 코드</text>
        <rect x="524" y="252" width="80" height="16" rx="2" fill="#f5f5f5"/>
        <text x="564" y="264" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">보드 몫 저장</text>
        <rect x="600" y="280" width="80" height="16" rx="2" fill="#f5f5f5"/>
        <text x="640" y="292" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">아직 등록 전</text>
        <rect x="580" y="336" width="120" height="16" rx="2" fill="#f5f5f5"/>
        <text x="640" y="348" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">3. QR 디스플레이</text>
        <rect x="618" y="368" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="640" y="377" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">4J7K2P</text>
        <rect x="260" y="400" width="120" height="16" rx="2" fill="#f5f5f5"/>
        <text x="320" y="412" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">4. 로그인 + 코드</text>
        <rect x="298" y="432" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="320" y="441" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">4J7K2P</text>
        <rect x="524" y="444" width="72" height="16" rx="2" fill="#f5f5f5"/>
        <text x="560" y="456" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">계정에 연결</text>
        <rect x="560" y="504" width="160" height="16" rx="2" fill="#f5f5f5"/>
        <text x="640" y="516" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">5. RESET 후 토큰 + 코드</text>
        <rect x="608" y="556" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="640" y="565" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">REGISTERED</text>
        <!-- Actors (drawn after arrows) -->
        <rect x="80" y="40" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="80" y="40" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="160" y="72" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">사용자 폰</text>
        <rect x="400" y="40" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="400" y="40" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="480" y="72" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">emcp 서버</text>
        <rect x="720" y="40" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="720" y="40" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="800" y="72" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">보드</text>
        <!-- Legend strip -->
        <line x1="40" y1="632" x2="920" y2="632" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <line x1="40" y1="656" x2="68" y2="656" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#board-registration-arrow)"/>
        <text x="76" y="660" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">요청</text>
        <line x1="124" y1="656" x2="152" y2="656" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#board-registration-arrow)"/>
        <text x="160" y="660" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">응답</text>
        <line x1="208" y1="656" x2="236" y2="656" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#board-registration-arrow-open)"/>
        <text x="244" y="660" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">화면 보고 옮김</text>
        <line x1="360" y1="656" x2="388" y2="656" stroke="#bf4520" stroke-width="1.4" marker-end="url(#board-registration-arrow-accent)"/>
        <text x="396" y="660" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">등록 완료</text>
        <rect x="480" y="648" width="8" height="16" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.06"/>
        <text x="496" y="660" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">처리 중</text>
        </svg>
