<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 656" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="board-registration-title board-registration-desc" id="board-registration-root">
        <title id="board-registration-title">보드 등록 흐름</title>
        <desc id="board-registration-desc">사용자가 보드에 Wi-Fi 정보를 넣으면 보드가 토큰과 등록 코드를 만들어 QR과 함께 디스플레이에 띄우고, 사용자가 폰으로 로그인해 그 코드로 보드를 등록한 뒤 RESET을 누르면 보드가 토큰과 코드를 보내 서버가 계정에 연결하고 registered를 돌려주는 순서를 보여 줍니다.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #board-registration-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #board-registration-root { font-family: var(--font-sans); color: var(--color-ink); }
      #board-registration-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#board-registration-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="board-registration-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="board-registration-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="board-registration-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Lifelines: phone 160, server 480, board 800 -->
        <line x1="160" y1="96" x2="160" y2="584" stroke="#2d3142" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.20"/>
        <line x1="480" y1="96" x2="480" y2="584" stroke="#2d3142" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.20"/>
        <line x1="800" y1="96" x2="800" y2="584" stroke="#2d3142" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.20"/>

        <!-- Activation bars -->
        <rect x="796" y="144" width="8" height="104" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.06"/>
        <rect x="476" y="304" width="8" height="56" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.06"/>
        <rect x="476" y="456" width="8" height="104" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.06"/>
        <rect x="796" y="440" width="8" height="120" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.06"/>

        <!-- Messages (time flows down) -->
        <!-- 1. Wi-Fi: phone -> board (setup page) -->
        <line x1="160" y1="144" x2="796" y2="144" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#board-registration-arrow)"/>
        <!-- board makes a token and a code once online (self) -->
        <path d="M 804,168 H 828 Q 836,168 836,176 V 184 Q 836,192 828,192 H 806" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#board-registration-arrow)"/>
        <!-- 2. person reads the QR off the display: board -> phone, not over the network -->
        <line x1="796" y1="240" x2="160" y2="240" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#board-registration-arrow-open)"/>
        <!-- 3. login + code: phone -> server -->
        <line x1="160" y1="304" x2="476" y2="304" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#board-registration-arrow)"/>
        <!-- server stores the code with the account (self) -->
        <path d="M 484,320 H 508 Q 516,320 516,328 V 336 Q 516,344 508,344 H 486" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#board-registration-arrow)"/>
        <!-- 4. RESET, then token + code: board -> server -->
        <line x1="796" y1="456" x2="484" y2="456" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#board-registration-arrow)"/>
        <!-- 5. link to account (self) -->
        <path d="M 484,472 H 508 Q 516,472 516,480 V 488 Q 516,496 508,496 H 486" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#board-registration-arrow)"/>
        <!-- registered: server -> board (headline) -->
        <line x1="484" y1="544" x2="796" y2="544" stroke="#bf4520" stroke-width="1.4" marker-end="url(#board-registration-arrow-accent)"/>

        <!-- Message labels, each on a paper mask -->
        <rect x="268" y="120" width="104" height="16" rx="2" fill="#f5f5f5"/>
        <text x="320" y="132" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">1. Wi-Fi 정보</text>
        <rect x="844" y="172" width="88" height="16" rx="2" fill="#f5f5f5"/>
        <text x="888" y="184" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">토큰·코드 생성</text>
        <rect x="580" y="216" width="120" height="16" rx="2" fill="#f5f5f5"/>
        <text x="640" y="228" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">2. QR 디스플레이</text>
        <rect x="618" y="248" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="640" y="257" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">4J7K2P</text>
        <rect x="260" y="280" width="120" height="16" rx="2" fill="#f5f5f5"/>
        <text x="320" y="292" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">3. 로그인 + 등록</text>
        <rect x="298" y="312" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="320" y="321" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">4J7K2P</text>
        <rect x="524" y="324" width="60" height="16" rx="2" fill="#f5f5f5"/>
        <text x="554" y="336" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">코드 저장</text>
        <rect x="572" y="432" width="136" height="16" rx="2" fill="#f5f5f5"/>
        <text x="640" y="444" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">4. RESET → 토큰 + 코드</text>
        <rect x="524" y="476" width="96" height="16" rx="2" fill="#f5f5f5"/>
        <text x="572" y="488" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">5. 계정에 연결</text>
        <rect x="608" y="524" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="640" y="533" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">REGISTERED</text>

        <!-- Actors (drawn after arrows) -->
        <rect x="80" y="40" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="80" y="40" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="160" y="72" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">사용자 폰</text>

        <rect x="400" y="40" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="400" y="40" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="480" y="72" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">emcp 서버</text>

        <rect x="720" y="40" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="720" y="40" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="800" y="72" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">보드</text>

        <!-- Legend strip -->
        <line x1="40" y1="608" x2="920" y2="608" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <line x1="40" y1="632" x2="68" y2="632" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#board-registration-arrow)"/>
        <text x="76" y="636" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">요청</text>
        <line x1="132" y1="632" x2="160" y2="632" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#board-registration-arrow-open)"/>
        <text x="168" y="636" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">화면 보고 옮김</text>
        <line x1="284" y1="632" x2="312" y2="632" stroke="#bf4520" stroke-width="1.4" marker-end="url(#board-registration-arrow-accent)"/>
        <text x="320" y="636" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">등록 완료</text>
        <rect x="404" y="624" width="8" height="16" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.06"/>
        <text x="420" y="636" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">처리 중</text>
      </svg>
