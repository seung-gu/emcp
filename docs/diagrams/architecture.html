<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>emcp architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1000px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 1.5rem;
    }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { width: 100%; min-width: 880px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · emcp</p>
    <h1>Who talks to the emcp server</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 880 496" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc">
        <title id="architecture-title">emcp architecture</title>
        <desc id="architecture-desc">Claude or ChatGPT, a browser and the ESP32 board call the emcp server on Fly.io, which uses Neon Postgres, WorkOS, open-meteo, GitHub Releases and Sentry.</desc>
        <defs>
          <style>
            .name { font-family: 'Geist', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: #2d3142; }
            .sub  { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 9px; fill: #4f5d75; }
            .lbl  { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 8px; letter-spacing: 0.08em; }
            .eye  { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 8px; letter-spacing: 0.14em; fill: #5a6580; }
            .key  { font-family: 'Geist', system-ui, sans-serif; font-size: 11px; fill: #4f5d75; }
          </style>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- zones -->
        <rect x="24" y="32" width="224" height="384" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="104" y="36" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="136" y="45" class="eye" text-anchor="middle">CLIENTS</text>
        <rect x="328" y="32" width="224" height="384" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="392" y="36" width="96" height="12" rx="2" fill="#f5f5f5"/>
        <text x="440" y="45" class="eye" text-anchor="middle">FLY.IO · FRA</text>
        <rect x="632" y="32" width="224" height="384" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="708" y="36" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="744" y="45" class="eye" text-anchor="middle">SERVICES</text>

        <!-- connectors: clients -> server -->
        <line x1="232" y1="160" x2="342" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="232" y1="232" x2="342" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="232" y1="304" x2="342" y2="304" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <!-- connectors: server -> services -->
        <line x1="536" y1="88" x2="646" y2="88" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <line x1="536" y1="160" x2="646" y2="160" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <line x1="536" y1="232" x2="646" y2="232" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <line x1="536" y1="304" x2="646" y2="304" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <line x1="536" y1="376" x2="646" y2="376" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

        <!-- connector labels (mask 6px above each line) -->
        <rect x="268" y="142" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="288" y="151" class="lbl" fill="#4f5d75" text-anchor="middle">/MCP</text>
        <rect x="256" y="214" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="288" y="223" class="lbl" fill="#4f5d75" text-anchor="middle">/DASHBOARD</text>
        <rect x="248" y="286" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="288" y="295" class="lbl" fill="#bf4520" text-anchor="middle">POST /WEATHER</text>
        <rect x="576" y="70" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="592" y="79" class="lbl" fill="#2e5aa8" text-anchor="middle">SQL</text>
        <rect x="548" y="142" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="592" y="151" class="lbl" fill="#2e5aa8" text-anchor="middle">SIGN-IN · JWKS</text>
        <rect x="564" y="214" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="592" y="223" class="lbl" fill="#2e5aa8" text-anchor="middle">FORECAST</text>
        <rect x="552" y="286" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="592" y="295" class="lbl" fill="#2e5aa8" text-anchor="middle">FIRMWARE .BIN</text>
        <rect x="568" y="358" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="592" y="367" class="lbl" fill="#2e5aa8" text-anchor="middle">ERRORS</text>

        <!-- clients (input) -->
        <rect x="40" y="136" width="192" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="136" width="192" height="48" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="136" y="157" class="name" text-anchor="middle">Claude / ChatGPT</text>
        <text x="136" y="172" class="sub" text-anchor="middle">MCP client · OAuth</text>

        <rect x="40" y="208" width="192" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="208" width="192" height="48" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="136" y="229" class="name" text-anchor="middle">Browser</text>
        <text x="136" y="244" class="sub" text-anchor="middle">dashboard · sign-in</text>

        <rect x="40" y="280" width="192" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="280" width="192" height="48" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="136" y="301" class="name" text-anchor="middle">ESP32-C3 e-ink board</text>
        <text x="136" y="316" class="sub" text-anchor="middle">wakes every 30 min</text>

        <!-- server (focal) -->
        <rect x="344" y="64" width="192" height="336" rx="6" fill="#f5f5f5"/>
        <rect x="344" y="64" width="192" height="336" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="360" y="96" class="name">emcp server</text>
        <text x="360" y="112" class="sub">Starlette · FastMCP · uv</text>
        <line x1="360" y1="136" x2="520" y2="136" stroke="rgba(191,69,32,0.25)" stroke-width="0.8"/>
        <text x="360" y="164" class="eye">MEMORY</text>
        <text x="360" y="182" class="sub">board copies</text>
        <text x="360" y="196" class="sub">latest firmware release</text>
        <line x1="360" y1="220" x2="520" y2="220" stroke="rgba(191,69,32,0.25)" stroke-width="0.8"/>
        <text x="360" y="248" class="eye">VOLUME /DATA</text>
        <text x="360" y="266" class="sub">reports waiting for</text>
        <text x="360" y="280" class="sub">the hourly move to Neon</text>
        <line x1="360" y1="304" x2="520" y2="304" stroke="rgba(191,69,32,0.25)" stroke-width="0.8"/>
        <text x="360" y="332" class="eye">SECRETS</text>
        <text x="360" y="350" class="sub">DATABASE_URL, WorkOS keys</text>

        <!-- services -->
        <rect x="648" y="64" width="192" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="648" y="64" width="192" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="744" y="85" class="name" text-anchor="middle">Neon Postgres 18</text>
        <text x="744" y="100" class="sub" text-anchor="middle">boards · reports · shares</text>

        <rect x="648" y="136" width="192" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="648" y="136" width="192" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="744" y="157" class="name" text-anchor="middle">WorkOS AuthKit</text>
        <text x="744" y="172" class="sub" text-anchor="middle">accounts · tokens</text>

        <rect x="648" y="208" width="192" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="648" y="208" width="192" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="744" y="229" class="name" text-anchor="middle">open-meteo</text>
        <text x="744" y="244" class="sub" text-anchor="middle">forecast · geocoding</text>

        <rect x="648" y="280" width="192" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="648" y="280" width="192" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="744" y="301" class="name" text-anchor="middle">GitHub Releases</text>
        <text x="744" y="316" class="sub" text-anchor="middle">commits.txt · weather-xiao.bin</text>

        <rect x="648" y="352" width="192" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="648" y="352" width="192" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="744" y="373" class="name" text-anchor="middle">Sentry</text>
        <text x="744" y="388" class="sub" text-anchor="middle">error mail · uptime</text>

        <!-- legend strip -->
        <line x1="24" y1="440" x2="856" y2="440" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <line x1="24" y1="468" x2="52" y2="468" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="60" y="472" class="key">board report</text>
        <line x1="148" y1="468" x2="176" y2="468" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="184" y="472" class="key">user request</text>
        <line x1="272" y1="468" x2="300" y2="468" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="308" y="472" class="key">outbound call</text>
        <rect x="408" y="462" width="14" height="12" rx="2" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="430" y="472" class="key">client</text>
        <rect x="480" y="462" width="14" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="502" y="472" class="key">database</text>
        <rect x="568" y="462" width="14" height="12" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="590" y="472" class="key">external service</text>
      </svg>
    </div>
  </div>
</body>
</html>
