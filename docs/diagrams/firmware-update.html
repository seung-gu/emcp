<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firmware update flow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1100px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 1.5rem;
    }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · emcp</p>
    <h1>From a firmware tag to an updated board</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="firmware-update-title firmware-update-desc">
        <title id="firmware-update-title">Firmware update flow</title>
        <desc id="firmware-update-desc">A version tag builds a release on GitHub, the workflow makes emcp fetch it, and a board on an older commit gets the offer with its weather, draws the screen, then downloads and installs the new firmware.</desc>
        <defs>
          <style>
            .name { font-family: 'Geist', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: #2d3142; }
            .sub  { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 9px; fill: #4f5d75; }
            .lbl  { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 8px; letter-spacing: 0.08em; }
            .op   { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 8px; letter-spacing: 0.12em; fill: #4f5d75; }
            .guard { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 8px; letter-spacing: 0.04em; fill: #4f5d75; }
            .key  { font-family: 'Geist', system-ui, sans-serif; font-size: 11px; fill: #4f5d75; }
          </style>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- fragments (behind everything else) -->
        <rect x="112" y="220" width="488" height="176" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <rect x="112" y="220" width="40" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="132" y="232" class="op" text-anchor="middle">LOOP</text>
        <text x="124" y="252" class="guard">[until SHA matches · max 10]</text>

        <rect x="552" y="548" width="364" height="160" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <rect x="552" y="548" width="40" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="572" y="560" class="op" text-anchor="middle">OPT</text>
        <text x="592" y="578" class="guard">[ota_version in the answer]</text>

        <!-- lifelines -->
        <line x1="136" y1="96" x2="136" y2="720" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="336" y1="96" x2="336" y2="720" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="576" y1="96" x2="576" y2="720" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="776" y1="96" x2="776" y2="720" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- messages -->
        <path d="M 136 132 H 172 V 156 H 140" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="136" y1="196" x2="334" y2="196" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="136" y1="280" x2="574" y2="280" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="576" y1="312" x2="338" y2="312" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="336" y1="344" x2="574" y2="344" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <line x1="576" y1="376" x2="138" y2="376" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <line x1="776" y1="440" x2="578" y2="440" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="576" y1="472" x2="774" y2="472" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <path d="M 776 504 H 812 V 528 H 780" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="776" y1="616" x2="578" y2="616" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="576" y1="648" x2="774" y2="648" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <path d="M 776 668 H 812 V 692 H 780" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- message labels -->
        <rect x="180" y="138" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="224" y="147" class="lbl" fill="#4f5d75" text-anchor="middle">BUILD ON TAG V*</text>
        <rect x="192" y="178" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="236" y="187" class="lbl" fill="#4f5d75" text-anchor="middle">CREATE RELEASE</text>
        <rect x="416" y="262" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="456" y="271" class="lbl" fill="#4f5d75" text-anchor="middle">POST /REFRESH</text>
        <rect x="424" y="294" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="456" y="303" class="lbl" fill="#4f5d75" text-anchor="middle">GET LATEST</text>
        <rect x="412" y="326" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="456" y="335" class="lbl" fill="#4f5d75" text-anchor="middle">COMMITS · .BIN</text>
        <rect x="204" y="358" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="236" y="367" class="lbl" fill="#4f5d75" text-anchor="middle">COMMIT SHA</text>
        <rect x="636" y="422" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="676" y="431" class="lbl" fill="#4f5d75" text-anchor="middle">POST /WEATHER</text>
        <rect x="636" y="454" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="676" y="463" class="lbl" fill="#bf4520" text-anchor="middle">WEATHER + OTA</text>
        <rect x="820" y="510" width="68" height="12" rx="2" fill="#f5f5f5"/>
        <text x="854" y="519" class="lbl" fill="#4f5d75" text-anchor="middle">DRAW SCREEN</text>
        <rect x="636" y="598" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="676" y="607" class="lbl" fill="#4f5d75" text-anchor="middle">GET /FIRMWARE</text>
        <rect x="660" y="630" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="676" y="639" class="lbl" fill="#4f5d75" text-anchor="middle">.BIN</text>
        <rect x="820" y="674" width="84" height="12" rx="2" fill="#f5f5f5"/>
        <text x="862" y="683" class="lbl" fill="#4f5d75" text-anchor="middle">FLASH · REBOOT</text>

        <!-- actors -->
        <rect x="56" y="40" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="56" y="40" width="160" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="136" y="64" class="name" text-anchor="middle">GitHub Actions</text>
        <text x="136" y="80" class="sub" text-anchor="middle">release.yml</text>

        <rect x="256" y="40" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="256" y="40" width="160" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="336" y="64" class="name" text-anchor="middle">GitHub Releases</text>
        <text x="336" y="80" class="sub" text-anchor="middle">latest release</text>

        <rect x="496" y="40" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="496" y="40" width="160" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="576" y="64" class="name" text-anchor="middle">emcp server</text>
        <text x="576" y="80" class="sub" text-anchor="middle">/firmware routes</text>

        <rect x="696" y="40" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="696" y="40" width="160" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="776" y="64" class="name" text-anchor="middle">ESP32-C3 board</text>
        <text x="776" y="80" class="sub" text-anchor="middle">weather-xiao</text>

        <!-- legend strip -->
        <line x1="56" y1="744" x2="904" y2="744" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <line x1="56" y1="772" x2="84" y2="772" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="92" y="776" class="key">call</text>
        <line x1="136" y1="772" x2="164" y2="772" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="172" y="776" class="key">reply</text>
        <line x1="228" y1="772" x2="256" y2="772" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="264" y="776" class="key">update offer</text>
      </svg>
    </div>
  </div>
</body>
</html>
