<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>보드 등록 흐름</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · emcp</p>
    <h1>보드 등록 흐름</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 624" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="board-registration-title board-registration-desc">
        <title id="board-registration-title">보드 등록 흐름</title>
        <desc id="board-registration-desc">사용자 폰이 로그인하고 서버에서 등록 코드를 받아 보드에 Wi-Fi 정보와 함께 넣으면, 보드가 토큰과 코드를 서버로 보내고 서버가 코드로 계정을 찾아 보드를 연결한 뒤 registered를 돌려주는 순서를 보여 줍니다.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Lifelines: phone 160, server 480, board 800 -->
        <line x1="160" y1="96" x2="160" y2="552" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="480" y1="96" x2="480" y2="552" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="800" y1="96" x2="800" y2="552" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- Activation bars -->
        <rect x="476" y="208" width="8" height="88" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="476" y="440" width="8" height="88" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="796" y="352" width="8" height="176" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

        <!-- Messages (time flows down) -->
        <!-- 1. login: phone -> server -->
        <line x1="160" y1="152" x2="480" y2="152" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 2. code request: phone -> server -->
        <line x1="160" y1="208" x2="476" y2="208" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- server stores the code (self) -->
        <path d="M 484,224 H 508 Q 516,224 516,232 V 240 Q 516,248 508,248 H 486" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- code back to phone (return) -->
        <line x1="476" y1="296" x2="160" y2="296" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <!-- 3. Wi-Fi + code: phone -> board -->
        <line x1="160" y1="352" x2="796" y2="352" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- board makes a token (self) -->
        <path d="M 804,368 H 828 Q 836,368 836,376 V 384 Q 836,392 828,392 H 806" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 4. token + code: board -> server -->
        <line x1="796" y1="440" x2="484" y2="440" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 5. link to account (self) -->
        <path d="M 484,456 H 508 Q 516,456 516,464 V 472 Q 516,480 508,480 H 486" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- registered: server -> board (headline) -->
        <line x1="484" y1="528" x2="796" y2="528" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <!-- Message labels, each on a paper mask -->
        <rect x="288" y="128" width="64" height="16" rx="2" fill="#f5f5f5"/>
        <text x="320" y="140" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">1. 로그인</text>

        <rect x="280" y="184" width="80" height="16" rx="2" fill="#f5f5f5"/>
        <text x="320" y="196" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">2. 코드 요청</text>

        <rect x="524" y="228" width="60" height="16" rx="2" fill="#f5f5f5"/>
        <text x="554" y="240" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">코드 저장</text>

        <rect x="298" y="276" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="320" y="285" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">4J7K2P</text>

        <rect x="266" y="328" width="108" height="16" rx="2" fill="#f5f5f5"/>
        <text x="320" y="340" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">3. Wi-Fi + 코드</text>

        <rect x="844" y="372" width="60" height="16" rx="2" fill="#f5f5f5"/>
        <text x="874" y="384" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">토큰 생성</text>

        <rect x="592" y="416" width="96" height="16" rx="2" fill="#f5f5f5"/>
        <text x="640" y="428" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">4. 토큰 + 코드</text>

        <rect x="524" y="460" width="96" height="16" rx="2" fill="#f5f5f5"/>
        <text x="572" y="472" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">5. 계정에 연결</text>

        <rect x="610" y="508" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text x="640" y="517" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">REGISTERED</text>

        <!-- Actors (drawn after arrows) -->
        <rect x="80" y="40" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="80" y="40" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="160" y="72" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">사용자 폰</text>

        <rect x="400" y="40" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="400" y="40" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="480" y="72" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">emcp 서버</text>

        <rect x="720" y="40" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="720" y="40" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="800" y="72" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">보드</text>

        <!-- Legend strip -->
        <line x1="40" y1="576" x2="920" y2="576" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <line x1="40" y1="600" x2="68" y2="600" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="76" y="604" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">요청</text>
        <line x1="132" y1="600" x2="160" y2="600" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="168" y="604" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">응답</text>
        <line x1="224" y1="600" x2="252" y2="600" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="260" y="604" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">등록 완료</text>
        <rect x="344" y="592" width="8" height="16" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <text x="360" y="604" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">처리 중</text>
      </svg>
    </div>
  </div>
</body>
</html>
