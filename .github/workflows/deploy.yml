# main 에 push 하면 테스트를 돌리고, 통과하면 emcp 앱을 Fly.io 에 배포한다. Actions 탭의 "Run workflow" 로
# 다시 배포할 수도 있다. 저장소 비밀값 FLY_API_TOKEN 이 필요하다: fly tokens create deploy -a emcp
# 옛 앱 emcp-led 는 손으로 배포한다 (README 의 Fly.io 배포).
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
