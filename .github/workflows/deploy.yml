# emcp 앱을 Fly.io 에 배포한다. 자동으로 돌지 않고, GitHub 의 Actions 탭에서 "Run workflow" 를 눌러야 돈다.
# main 에 바로 커밋하므로 push 마다 배포하면 결과를 보고 승인하는 단계가 없어진다.
# 테스트가 통과해야 배포한다. 저장소 비밀값 FLY_API_TOKEN 이 필요하다: fly tokens create deploy -a emcp
# 옛 앱 emcp-led 는 손으로 배포한다 (README 의 Fly.io 배포).
name: deploy

on:
  workflow_dispatch:

concurrency: deploy

jobs:
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
