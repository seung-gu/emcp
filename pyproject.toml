[project]
name = "emcp"
version = "0.1.0"
description = "Embedded LED control MCP server (Claude/ChatGPT -> flag -> ESP32 polling)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "mcp>=1.28.1",
    "psycopg[binary]>=3.3.7",
    "pyjwt[crypto]>=2.13.0",
    "workos>=10.6.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
